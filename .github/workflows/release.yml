name: Release
on:
  push:
    tags: ['v0.1.0-mvp.11']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: git merge-base --is-ancestor HEAD origin/main
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_skill.py
      - run: python -m unittest discover -s tests -p test_release.py -v
      - run: python scripts/build_release.py --out .cache/release
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .cache/release/* --verify-tag --prerelease --title "$GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
